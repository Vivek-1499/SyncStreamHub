<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bg-grad)" />
  
  <!-- Popcorn Pieces Top -->
  <circle cx="40" cy="32" r="10" fill="url(#pop-grad)" />
  <circle cx="50" cy="25" r="12" fill="url(#pop-grad)" />
  <circle cx="60" cy="32" r="10" fill="url(#pop-grad)" />
  <circle cx="33" cy="37" r="8" fill="url(#pop-grad)" />
  <circle cx="67" cy="37" r="8" fill="url(#pop-grad)" />

  <!-- Popcorn Bucket Base -->
  <path d="M 28 42 L 33 82 C 33.2 83.5 34.5 84.5 36 84.5 L 64 84.5 C 65.5 84.5 66.8 83.5 67 82 L 72 42 Z" fill="url(#box-grad)" />
  
  <!-- White Bucket Stripes -->
  <path d="M 38 42 L 41 84.5 L 46 84.5 L 44 42 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 56 42 L 54 84.5 L 59 84.5 L 62 42 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Play Symbol Center Glow -->
  <path d="M 46 55 L 58 62 L 46 69 Z" fill="#FFFFFF" filter="url(#glow)"/>
</svg>