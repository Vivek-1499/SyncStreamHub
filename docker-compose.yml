services:
  postgres:
    image: postgres:15-alpine
    container_name: syncstream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: SyncStream
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - syncstream-net

  mongodb:
    image: mongo:6.0
    container_name: syncstream-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-mongo_password}
    volumes:
      - mongo_data:/data/db
    networks:
      - syncstream-net

  redis:
    image: redis:7-alpine
    container_name: syncstream-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - syncstream-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  syncstream-net:
    driver: bridge
