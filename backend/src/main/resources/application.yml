server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: syncstream-hub

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  # Default Base Configuration (Overridden by application-local.yml or application-prod.yml)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SyncStream}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:mongo_password@localhost:27017/syncstream?authSource=admin}

    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Logging config
logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.data.mongodb.core.MongoTemplate: WARN

cloudflare:
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:your_r2_account_id_here}
    access-key-id: ${R2_ACCESS_KEY_ID:your_r2_access_key_id_here}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:your_r2_secret_access_key_here}
    bucket-name: ${R2_BUCKET_NAME:syncstream-videos}
    public-url: ${R2_PUBLIC_URL:https://pub-xxxx.r2.dev}

    com.syncstream.hub: INFO
